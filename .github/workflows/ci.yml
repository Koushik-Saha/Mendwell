name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # reads the version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Scanner tests drive real Chromium (pinned Playwright). Cache the browser download per version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/scanner/package.json').dependencies.playwright")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mendwell/scanner exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mendwell/scanner exec playwright install-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Hard rule 7 / SECURITY.md T8: every API route must return 404 to another org.
      # Also part of `pnpm test`; run on its own so a failure is obvious in the checks list.
      - name: Cross-org access (every API route)
        run: pnpm test:cross-org

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations || (echo "::error::Schema changed without a migration. Run pnpm db:generate and commit it." && exit 1)
          test -z "$(git status --porcelain -- packages/db/migrations)" || (echo "::error::Untracked migration files. Run pnpm db:generate and commit them." && exit 1)

  connector:
    name: Connector (PHPUnit on WP 6.2 / PHP 7.4 via wp-env)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: PHP syntax
        run: pnpm --filter mendwell-connector lint:php

      - name: Start WordPress (wp-env)
        run: pnpm --filter mendwell-connector wp-env start

      - name: PHPUnit
        run: pnpm test:connector

      # Apply → verify → rollback against the real plugin in this WordPress (PROJECT_SPEC §3).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/scanner/package.json').dependencies.playwright")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mendwell/scanner exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mendwell/scanner exec playwright install-deps chromium

      - name: Fix engine end to end (wp-env)
        run: pnpm --filter @mendwell/worker test:e2e:wp

      - name: Build zip
        run: pnpm --filter mendwell-connector build

      - uses: actions/upload-artifact@v7
        with:
          name: mendwell-connector-zip
          path: plugins/mendwell-connector/dist/*.zip
          retention-days: 14
